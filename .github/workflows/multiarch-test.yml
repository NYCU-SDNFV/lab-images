name: lab-base resource validation
on:
  workflow_call:
  push:
    branches: [resource-limits-fix]
    paths: ['base/**', 'tests/**', '.github/workflows/multiarch-test.yml']
permissions:
  contents: read
  packages: write
concurrency:
  group: lab-base-resource-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/nycu-sdnfv/lab-base
  TEST_TAG: ${{ github.ref == 'refs/heads/main' && format('sha-{0}', github.sha) || '115-1-resource-test' }}
jobs:
  build-test:
    name: native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: base
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/NYCU-SDNFV/lab-images
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Native resource unit and integration tests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          test "$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          docker run --rm --entrypoint python3 \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" \
            "${IMAGE}@${DIGEST}" \
            -m unittest discover -s /src/tests -p test_resources.py -v
      - name: Reject an unprepared host without hiding the error
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # A deterministic invalid fixture, only on this disposable runner VM.
          sudo sysctl -qw net.core.wmem_max=212992
          if docker run --rm --privileged --ulimit nofile=65536:65536 \
            --entrypoint python3 "${IMAGE}@${DIGEST}" \
            -c 'from mininet.util import fixLimits; fixLimits()' \
            > "${RUNNER_TEMP}/unprepared-host.log" 2>&1; then
            cat "${RUNNER_TEMP}/unprepared-host.log"
            echo "An unprepared host was incorrectly accepted" >&2
            exit 1
          fi
          cat "${RUNNER_TEMP}/unprepared-host.log"
          grep -F 'lab_resources.ResourceError:' "${RUNNER_TEMP}/unprepared-host.log"
          grep -F 'net.core.wmem_max=212992' "${RUNNER_TEMP}/unprepared-host.log"
          grep -F 'host-prepare --profile course' "${RUNNER_TEMP}/unprepared-host.log"
      - name: Prepare and verify the Docker ENGINE host
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --privileged --network host --entrypoint python3 \
            "${IMAGE}@${DIGEST}" -m lab_resources host-prepare --profile course
          docker run --rm --network host --entrypoint python3 \
            "${IMAGE}@${DIGEST}" -m lab_resources host-verify --profile course
          docker run --rm --network host --entrypoint python3 \
            "${IMAGE}@${DIGEST}" -m lab_resources host-config --profile course \
            > "${RUNNER_TEMP}/course-sysctl.conf"
          sudo sysctl -n net.ipv4.tcp_rmem net.ipv4.tcp_wmem \
            net.core.rmem_max net.core.wmem_max kernel.pty.max \
            > "${RUNNER_TEMP}/host-limits.before"
      - name: Native isolated image smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          timeout 180s docker run --rm --privileged --ulimit nofile=1048576:1048576 \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/tests,dst=/tests,readonly" \
            "${IMAGE}@${DIGEST}" python3 -u /tests/smoke.py "${{ matrix.arch }}" \
            2>&1 | tee "${RUNNER_TEMP}/isolated-smoke.log"
          if grep -Fq "Error setting resource limits" "${RUNNER_TEMP}/isolated-smoke.log"; then
            echo "The original resource-limit warning remains" >&2
            exit 1
          fi
          grep -F 'MININET_NOFILE {"soft": 65536, "hard": 1048576}' "${RUNNER_TEMP}/isolated-smoke.log"
          sudo sysctl -n net.ipv4.tcp_rmem net.ipv4.tcp_wmem \
            net.core.rmem_max net.core.wmem_max kernel.pty.max \
            > "${RUNNER_TEMP}/host-limits.after"
          diff -u "${RUNNER_TEMP}/host-limits.before" "${RUNNER_TEMP}/host-limits.after"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-evidence-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/unprepared-host.log
            ${{ runner.temp }}/course-sysctl.conf
            ${{ runner.temp }}/isolated-smoke.log
            ${{ runner.temp }}/host-limits.before
            ${{ runner.temp }}/host-limits.after
          if-no-files-found: warn
          retention-days: 7
      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  publish-test-tag:
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish only the test tag
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "${RUNNER_TEMP}/digests/${arch}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("${IMAGE}@${digest}")
          done
          docker buildx imagetools create --tag "${IMAGE}:${TEST_TAG}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TEST_TAG}" --raw \
            | tee "${RUNNER_TEMP}/multiarch-manifest.json"
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture]
            | sort == ["amd64", "arm64"]' "${RUNNER_TEMP}/multiarch-manifest.json"
          {
            echo "## Published ${IMAGE}:${TEST_TAG}"
            echo "Native amd64 and arm64 resource tests and isolated smoke passed for ${GITHUB_SHA}."
            echo "Full Lab grading is a separate PVE validation; this workflow does not claim it."
            echo "The production 115-1/latest and baseline 115-1-multiarch-test tags are not updated."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: multiarch-manifest
          path: ${{ runner.temp }}/multiarch-manifest.json
          if-no-files-found: error
          retention-days: 7
